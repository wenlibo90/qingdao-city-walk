<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c1218" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1218'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23e99352'%3E%E9%9D%92%3C/text%3E%3C/svg%3E" />
    <title>青岛 · 山海城漫游</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <div id="hud">
      <header class="topbar">
        <div class="brand">
          <div>
            <h1>青岛 · 山海城漫游</h1>
            <p>QINGDAO COASTAL WALK / PROCEDURAL CITY</p>
          </div>
        </div>
        <div class="topmeta">
          <span class="tag" id="backend-tag">WEBGPU · TSL</span>
          <span class="attribution">OSM 地理数据 © OpenStreetMap contributors · ODbL</span>
          <span class="attribution">地形 DEM · AWS Terrain Tiles / Mapzen</span>
        </div>
      </header>

      <aside id="panel">
        <div class="panel-body" id="panel-body">
          <section class="block">
            <div class="block-head">
              <span class="label">时间轴</span>
              <div class="time-readout"><strong id="time-label">12:30</strong><span id="phase-label">正午</span></div>
            </div>
            <input id="time-slider" type="range" min="0" max="24" step="0.05" value="12.5" aria-label="时间" />
            <div class="chips" id="preset-chips"></div>
          </section>

          <section class="block">
            <div class="block-head">
              <span class="label">街道路名检索</span>
              <span class="mini" id="street-count"></span>
            </div>
            <div class="search-wrap">
              <input id="street-input" type="search" placeholder="中山路 / 韶关路 / 澳门路 …" autocomplete="off" spellcheck="false" />
              <span class="search-icon">⌕</span>
            </div>
            <div id="street-results" class="results" role="listbox"></div>
          </section>

          <section class="block">
            <div class="block-head">
              <span class="label">地标传送</span>
            </div>
            <div class="chips wrap" id="teleport-chips"></div>
          </section>

          <section class="block actions">
            <button id="tour-btn" class="primary">自动巡游</button>
            <button id="view-btn">第三人称</button>
          </section>
        </div>
      </aside>

      <div id="crosshair" class="crosshair"></div>

      <div id="controls-hint">
        <span><b>W A S D</b> 步行</span>
        <span><b>Shift</b> 加速</span>
        <span><b>鼠标</b> 视角</span>
        <span><b>V</b> 视角切换</span>
        <span><b>Esc</b> 释放鼠标</span>
      </div>

      <div id="stats">
        <span id="fps">-- FPS</span>
        <span id="stat-buildings">-- 栋建筑</span>
        <span id="stat-calls">-- draw calls</span>
      </div>

      <div id="toast"></div>
    </div>

    <div id="fade"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
